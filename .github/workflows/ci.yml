name: Outbreak Nowcaster CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents cli.py incidence.py nowcaster.py enrichment.py simulator.py
      - name: Run Python regression tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser scripts and calculations
        run: |
          node --check web/nowcast.js
          node --check web/app.js
          node --test web/nowcast.test.cjs
      - name: Verify local audit chain
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
