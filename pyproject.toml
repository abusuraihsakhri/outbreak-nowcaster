[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak-nowcaster"
version = "3.1.0"
description = "Illustrative surveillance delay-adjusted incidence nowcaster and legacy task-audit utilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dr. Abu Suraih Sakhri", email = "abusuraihsakhri@noreply.github.com"}]
keywords = ["outbreak", "nowcasting", "epidemiology", "surveillance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
outbreak-nowcaster = "cli:main"
nowcaster = "nowcaster:main"
incidence-nowcast = "incidence:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["cli", "nowcaster", "incidence", "enrichment", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test"]
python_functions = ["test_*"]
